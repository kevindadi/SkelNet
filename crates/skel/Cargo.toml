[package]
name = "skel"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
concir = { path = "../concir" }
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[[bin]]
name = "skelnet"
path = "src/main.rs"

[dev-dependencies]
insta = "1"
